<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiceLab — Explore Probability</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <p>Rolls: <span id="roll-count">0</span></p>
  <p>Last 10 totals, oldest first: <span id="roll-history">None yet</span></p>
  <button id="reset-button" type="button">Reset experiment</button>
</head>
<body>
  <main>
    <h1>DiceLab 🎲</h1>
    <p>Are you unlucky, or is it just probability?</p>

    <div aria-live="polite">
      <p>Dice: <span id="die-one">–</span> and <span id="die-two">–</span></p>
      <p>Total: <span id="total">–</span></p>
    </div>

    <button id="roll-button" type="button">Roll dice</button>
  </main>
</body>
</html>
